 py:`import osmnx as ox, networkx as nx, geopandas as gpd, shapely
G = ox.graph_from_place("{{lieu}}", network_type="{{mode}}")
if "{{mode}}" == "walk":
    for u, v, k, d in G.edges(keys=True, data=True): d["travel_time"] = d["length"] / (4.5 / 3.6)
else:
    G = ox.add_edge_speeds(G); G = ox.add_edge_travel_times(G)
lat, lon = map(float, "{{o}}".split(","))
c = ox.nearest_nodes(G, lon, lat); nodes = ox.graph_to_gdfs(G, edges=False); rows = []
for m in sorted(int(x) for x in "{{mins}}".split(",")):
    sub = nx.ego_graph(G, c, radius=m * 60, distance="travel_time")
    pts = shapely.MultiPoint(list(nodes.loc[list(sub.nodes)].geometry))
    rows.append({"minutes": m, "geometry": shapely.concave_hull(pts, ratio=0.3)})
gpd.GeoDataFrame(rows, crs=nodes.crs).to_file("{{out}}", driver="GPKG")`},

 py:`import geopandas as gpd, numpy as np, rasterio
from rasterio.transform import from_origin
p = gpd.read_file("{{in}}"); xy = np.c_[p.geometry.x, p.geometry.y]; v = p["{{champ}}"].to_numpy(float)
def idw(q, pts, val, pw=2):
    d = np.hypot(*(pts - q).T)
    return val[d.argmin()] if d.min() == 0 else (val / d**pw).sum() / (1 / d**pw).sum()
# Validation croisée : chaque station est estimée sans elle-même
err = [v[i] - idw(xy[i], np.delete(xy, i, 0), np.delete(v, i)) for i in range(len(v))]
print("Erreur quadratique moyenne :", round(float(np.sqrt(np.mean(np.square(err)))), 2))
r = {{res}}; x0, y0, x1, y1 = p.total_bounds
xs, ys = np.arange(x0, x1, r), np.arange(y1, y0, -r)
grille = np.array([[idw(np.array([x, y]), xy, v) for x in xs] for y in ys], dtype="float32")
with rasterio.open("{{out}}", "w", driver="GTiff", height=grille.shape[0], width=grille.shape[1], count=1,
                   dtype="float32", crs=p.crs, transform=from_origin(x0, y1, r, r)) as d: d.write(grille, 1)`},

def masque(img):
    scl = img.select("SCL"); ok = scl.neq(3).And(scl.neq(8)).And(scl.neq(9)).And(scl.neq(10))
    return img.updateMask(ok).divide(10000)

      .filterDate("{{d1}}", "{{d2}}").filter(ee.Filter.lt("CLOUDY_PIXEL_PERCENTAGE", 60)).map(masque))
ndvi = s2.median().normalizedDifference(["B8", "B4"]).rename("NDVI").clip(zone)

const TEXTRA={tbl:["Table PostGIS","public.communes"],tbl2:["Seconde table PostGIS","public.zones"],crs:["Projection (EPSG)","EPSG:2154"],layer:["Nom de la couche",""],in:["Couche d'entrée","donnees/communes.gpkg"],in2:["Seconde couche","donnees/zones.gpkg"],out:["Fichier de sortie","resultats/resultat.gpkg"],id:["Champ identifiant","code_insee"],cle:["Code dans la couche","code_insee"],cle2:["Code dans le tableau","CODGEO"]};
const DERIVED=["srid","schema","tblname"];
function toolLangs(o){return Object.keys(LANGS).filter(l=>o[l])}
function toolVals(o){
  const v={};Object.entries(TEXTRA).forEach(([k,[,d]])=>v[k]=d);
  o.p.forEach(([k,,d])=>v[k]=d);Object.assign(v,(S.tv||{})[o.id]||{});
  if(!v.layer)v.layer=String(v.in||"couche").split("/").pop().replace(/\.[^.]+$/,"");
  v.srid=String(v.crs||"EPSG:2154").replace(/\D/g,"")||"2154";
  const t=String(v.tbl||"public.communes").split(".");v.schema=t.length>1?t[0]:"public";v.tblname=t[t.length-1];
  return v;
}
const fillT=(t,v)=>String(t).replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k]!=null&&v[k]!==""?v[k]:m);
function toolPrompt(o,v,lang){
  const params=o.p.map(([k,l])=>`- ${l} : ${v[k]}`).join("\n");
  const cible=lang&&LANGS[lang]?LANGS[lang][0]:"Python (GeoPandas) de préférence";
  return `Rôle : Tu es géomaticien expert en géotraitement (QGIS, GDAL, Python, PostGIS).

Contexte : Je dois réaliser le traitement « ${o.n} ». ${o.d}

Données et paramètres :
${params}

Tâches :

${o.st.map((s,i)=>`${i+2}. ${s}.`).join("\n")}
${o.st.length+2}. Propose des contrôles pour vérifier le résultat (comptages, surfaces, visualisation rapide).

Contraintes : outils libres ; SCR métrique pour les distances et les surfaces ; ne jamais écraser les données sources ; code commenté en français ; gestion des erreurs courantes (fichier absent, SCR manquant, géométrie vide).

Livrables attendus : la méthode expliquée en quelques lignes, le script complet en ${cible} prêt à exécuter, les bibliothèques à installer et les points de vigilance.

Format de réponse : pose-moi d'abord jusqu'à 3 questions si une information essentielle manque, puis réponds par étapes numérotées.`;
}
function toolText(o){
  const v=toolVals(o);const mode=S.tmode||"prompt";
  if(mode==="prompt")return toolPrompt(o,v,S.tlang);
  const ls=toolLangs(o);const l=ls.includes(S.tlang)?S.tlang:ls[0];
  return fillT(o[l],v);
}
function toolCard(o){const ls=toolLangs(o);
  return `<button type="button" class="card pcard tool" data-open-tool="${esc(o.id)}">

function pbText(v){
  const parts=[];
  if(v.role)parts.push(`Rôle : ${v.role}`);
  if(v.contexte)parts.push(`Contexte : ${v.contexte}`);
  if(v.donnees)parts.push(`Données et paramètres :\n${v.donnees}`);
  if(v.taches)parts.push(`Tâches :\n${v.taches.split("\n").map(x=>x.trim()).filter(Boolean).map((t,i)=>`${i+1}. ${t}`).join("\n")}`);
  if(v.contraintes)parts.push(`Contraintes : ${v.contraintes}`);
  if(v.livrables)parts.push(`Livrables : ${v.livrables}`);
  if(v.format)parts.push(`Format de réponse : ${v.format}`);
  return parts.join("\n\n");
}

    <div class="chips"><span class="status" style="align-self:center">${mode==="prompt"?"Réponse attendue en :":"Langage :"}</span>${[["","Tous"],...Object.entries(LANGS).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button type="button" class="chip" data-tlang="${k}" aria-pressed="${(S.tlang||"")===k}">${esc(l)}</button>`).join("")}</div>

  <div class="chips scroll"><button type="button" class="chip" data-tfam="" aria-pressed="${!fam}">Toutes les familles</button>${Object.entries(FAM).map(([k,l])=>`<button type="button" class="chip" data-tfam="${k}" aria-pressed="${fam===k}">${esc(l)}</button>`).join("")}</div>
  <span class="status">${list.length} traitements affichés</span>
  ${groups.length?groups.map(([k,arr])=>`<section><h2>${esc(FAM[k])} <span class="status">${arr.length}</span></h2><div class="grid">${arr.map(toolCard).join("")}</div></section>`).join(""):`<div class="empty">Aucun traitement ne correspond. Essayez un autre mot ou décrivez votre besoin avec le bouton « Autre traitement » ci-dessous.</div>`}
  <section class="card" style="background:var(--surface-2)">
    <h3>Créez votre prompt sur mesure</h3>
    <p class="muted">Vous partez de zéro ? Répondez aux questions ci-dessous : votre prompt s'écrit au fur et à mesure, prêt à copier dans un assistant IA.</p>
    <div class="form">
      <label class="full">Rôle (qui doit répondre)<input data-pb="role" placeholder="ex. Tu es expert en géomatique et en analyse spatiale" value="${esc(pb.role||"")}"></label>
      <label class="full">Contexte (zone, projet, situation)<textarea data-pb="contexte" placeholder="ex. Commune rurale du Burkina Faso, projet d'accès à l'eau potable">${esc(pb.contexte||"")}</textarea></label>
      <label class="full">Données et paramètres disponibles<textarea data-pb="donnees" placeholder="ex. Couche des forages (GeoPackage), couche des villages (Shapefile), SCR EPSG:32630">${esc(pb.donnees||"")}</textarea></label>
      <label class="full">Tâches à réaliser (une par ligne)<textarea data-pb="taches" placeholder="ex. Vérifier le SCR des deux couches">${esc(pb.taches||"")}</textarea></label>
      <label class="full">Contraintes<textarea data-pb="contraintes" placeholder="ex. Outils libres uniquement, ne pas modifier les fichiers sources">${esc(pb.contraintes||"")}</textarea></label>
      <label>Livrables<input data-pb="livrables" placeholder="ex. Script Python commenté" value="${esc(pb.livrables||"")}"></label>
      <label>Format de réponse<input data-pb="format" placeholder="ex. Code uniquement, sans explication" value="${esc(pb.format||"")}"></label>
    </div>
    <p class="subhead" style="margin-top:14px">Votre prompt</p>
    <pre class="prompt code" id="pb-out">${esc(pbText(pb)||"Remplissez les champs ci-dessus : votre prompt apparaîtra ici au fur et à mesure.")}</pre>
    <div class="row"><button class="btn primary" type="button" data-pb-copy>Copier mon prompt</button><button class="btn" type="button" data-pb-dl>Télécharger</button><button class="btn ghost" type="button" data-pb-reset>Recommencer</button></div>
  </section>`;
};
function toolModal(o){
  const mode=S.tmode||"prompt";const ls=toolLangs(o);const l=mode==="script"?(ls.includes(S.tlang)?S.tlang:ls[0]):S.tlang;
  const v=toolVals(o);const txt=toolText(o);
  const used=[...new Set((mode==="script"?[...String(o[l]).matchAll(/\{\{(\w+)\}\}/g)]:[]).map(m=>m[1]))].filter(k=>!o.p.some(p=>p[0]===k)&&!DERIVED.includes(k));
  const fields=[...o.p.map(([k,lab])=>[k,lab]),...used.map(k=>[k,(TEXTRA[k]||[k])[0]])];
  openModal(`<header><div style="min-width:0"><span class="eyebrow">${esc(FAM[o.f])}</span><h2>${esc(o.n)}</h2></div><button class="btn ghost" data-close aria-label="Fermer">✕</button></header>
  <p class="muted">${esc(o.d)}</p>
  <div class="row" style="gap:10px"><div class="subtabs" role="tablist">${[["prompt","Prompt"],["script","Script d'automatisation"]].map(([k,t])=>`<button type="button" data-tm2="${k}" aria-selected="${mode===k}">${t}</button>`).join("")}</div>
   <div class="chips">${(mode==="script"?ls:["",...Object.keys(LANGS)]).map(k=>`<button type="button" class="chip" data-tl2="${k}" aria-pressed="${(l||"")===k}">${k?esc(LANGS[k][0]):"Au choix"}</button>`).join("")}</div></div>
  ${mode==="script"&&S.tlang&&!ls.includes(S.tlang)?`<p class="status">Pas de version ${esc(LANGS[S.tlang][0])} pour ce traitement : voici la version ${esc(LANGS[l][0])}.</p>`:""}
  <pre class="prompt code" id="tool-text">${esc(txt)}</pre>
  <details class="params"><summary>Vos fichiers et paramètres</summary><div class="form" style="margin-top:10px">${fields.map(([k,lab])=>`<label>${esc(lab)}<input id="tp-${esc(k)}" data-tparam="${esc(k)}" value="${esc(v[k]??"")}"></label>`).join("")}</div></details>
  <div class="row"><button class="btn primary" data-copy-tool>Copier ${mode==="prompt"?"le prompt":"le script"}</button><button class="btn" data-dl-tool>Télécharger</button><button class="btn ghost" data-reset-tool>Paramètres par défaut</button></div>
  ${mode==="script"?`<p class="status">Étapes : ${o.st.map(esc).join(" → ")}.</p>`:""}`);
  const box=document.querySelector("#modal-root .params");
  box.addEventListener("input",e=>{const k=e.target.dataset.tparam;if(!k)return;S.tv=S.tv||{};S.tv[o.id]={...(S.tv[o.id]||{}),[k]:e.target.value};document.getElementById("tool-text").textContent=toolText(o)});
  S.curTool=o.id;
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-open-tool],[data-tmode],[data-tlang],[data-tfam],[data-tm2],[data-tl2],[data-copy-tool],[data-dl-tool],[data-reset-tool],[data-pb-copy],[data-pb-dl],[data-pb-reset]");if(!t)return;const d=t.dataset;
  const cur=()=>OUTILS.find(o=>o.id===S.curTool);
  if(d.openTool){const o=OUTILS.find(x=>x.id===d.openTool);if(o)toolModal(o);return}
  if(d.tmode){S.tmode=d.tmode;render();return}
  if(d.tlang!==undefined){S.tlang=d.tlang;render();return}
  if(d.tfam!==undefined){S.tfam=d.tfam;render();return}
  if(d.tm2){S.tmode=d.tm2;render();toolModal(cur());return}
  if(d.tl2!==undefined){S.tlang=d.tl2;render();toolModal(cur());return}
  if(d.copyTool!==undefined){copy(document.getElementById("tool-text").textContent);return}
  if(d.resetTool!==undefined){const o=cur();if(S.tv)delete S.tv[o.id];toolModal(o);return}
  if(d.dlTool!==undefined){const o=cur();const mode=S.tmode||"prompt";const ls=toolLangs(o);const l=ls.includes(S.tlang)?S.tlang:ls[0];
    const ext=mode==="prompt"?"txt":LANGS[l][1];const name=`${o.id}_${mode==="prompt"?"prompt":l}.${isClaude()&&ext!=="txt"?ext+".txt":ext}`;
    dl(name,document.getElementById("tool-text").textContent);return}
  if(d.pbCopy!==undefined){const txt=pbText(S.pb||{});if(!txt){toast("Remplissez au moins un champ");return}copy(txt);return}
  if(d.pbDl!==undefined){const txt=pbText(S.pb||{});if(!txt){toast("Remplissez au moins un champ");return}dl("mon-prompt.txt",txt);return}
  if(d.pbReset!==undefined){S.pb={};render();return}
});
document.addEventListener("input",e=>{const d=e.target.dataset;if(!d)return;
  if(d.tq!==undefined){S.tq=e.target.value;clearTimeout(S.tqt);S.tqt=setTimeout(render,200);return}
  if(d.pb!==undefined){S.pb=S.pb||{};S.pb[d.pb]=e.target.value;const out=document.getElementById("pb-out");if(out)out.textContent=pbText(S.pb)||"Remplissez les champs ci-dessus : votre prompt apparaîtra ici au fur et à mesure.";return}
});

/* ---------- Alertes (veille et rendez-vous) ---------- */
function alarmes(){return S.data.reglages.find(r=>r.id==="alarmes")||{actif:false,veille:true,evenements:true,minutesAvant:15}}
function notifStatus(){return (typeof Notification!=="undefined")?Notification.permission:"unsupported"}
function notifLabel(){return {granted:"autorisées",denied:"refusées dans le navigateur",default:"pas encore demandées",unsupported:"non disponibles sur ce navigateur"}[notifStatus()]}
function alreadyAlerted(key){try{return localStorage.getItem("gm-alert-"+key)==="1"}catch(e){return false}}
function markAlerted(key){try{localStorage.setItem("gm-alert-"+key,"1")}catch(e){}}
function alarmSound(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const beep=t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(.25,ctx.currentTime+t+.02);g.gain.linearRampToValueAtTime(0,ctx.currentTime+t+.28);
    o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.3)};
  beep(0);beep(.35);setTimeout(()=>ctx.close(),1200)}catch(e){}}
function fireAlarm(title,body){
  alarmSound();
  if(notifStatus()==="granted"){try{new Notification(title,{body,icon:"icons/icon-192.png",tag:title})}catch(e){}}
  const el=document.createElement("div");el.className="alarm-banner";
  el.innerHTML=`<span style="flex:1;min-width:0"><b>${esc(title)}</b>${esc(body)}</span><button type="button">Fermer</button>`;
  el.querySelector("button").onclick=()=>el.remove();
  document.body.appendChild(el);setTimeout(()=>el.remove(),12000);
}
function checkAlarms(){
  const a=alarmes();if(!a.actif||!S.loaded||!USER)return;
  const now=new Date();const t=today();
  if(a.veille){
    const meta=(S.data.meta||[]).find(m=>m.id==="etat")||{};
    const dv=String(meta.derniereVeille||"").slice(0,10);
    if(dv===t&&!alreadyAlerted("veille-"+t)){markAlerted("veille-"+t);fireAlarm("Veille du jour prête",meta.resume||"De nouveaux prompts et informations sont disponibles.")}
  }
  if(a.evenements){
    const mins=Number(a.minutesAvant)||15;
    (S.data.agenda||[]).filter(e=>e.date===t&&e.debut).forEach(e=>{
      const [h,m]=e.debut.split(":").map(Number);const evT=new Date();evT.setHours(h,m,0,0);
      const diff=(evT-now)/60000;
      if(diff<=mins&&diff>=-2&&!alreadyAlerted("evt-"+e.id)){markAlerted("evt-"+e.id);fireAlarm("Rendez-vous : "+e.titre,`${e.debut}${e.lieu?" · "+e.lieu:""}`)}
    });
  }
}
function maybeAskAlarms(){
  if(!S.loaded||S.alarmAsked||alarmes().asked||$("#modal-root").innerHTML)return;
  S.alarmAsked=true;
  setTimeout(async()=>{
    if($("#modal-root").innerHTML)return;
    await put("reglages","alarmes",{...alarmes(),asked:true});
    openModal(`<header><h2>Activer les alertes ?</h2><button class="btn ghost" data-close aria-label="Fermer">✕</button></header>

     <div class="row"><button class="btn primary" type="button" data-al-enable>Activer les alertes</button><button class="btn ghost" type="button" data-close>Plus tard</button></div>`);
  },1200);
}

/* ---------- Empreinte et signature ---------- */
function sortKeys(x){if(Array.isArray(x))return x.map(sortKeys);if(x&&typeof x==="object")return Object.keys(x).sort().reduce((o,k)=>(o[k]=sortKeys(x[k]),o),{});return x}
async function sha256(txt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function docCanon(f,pr){const t=totals(f);return JSON.stringify(sortKeys({type:f.type,numero:f.numero,date:f.date,echeance:f.echeance||null,validite:f.validite||null,client:f.client||"",clientAdresse:f.clientAdresse||"",objet:f.objet||"",devise:f.devise,tva:Number(f.tva)||0,
  lignes:(f.lignes||[]).map(l=>({libelle:l.libelle,qte:Number(l.qte)||0,unite:l.unite||"",pu:Number(l.pu)||0})),mentions:f.mentions||"",total_ttc:Math.round(t.ttc*100)/100,
  emetteur:{nom:pr.nom||"",raison:pr.raison||"",siret:pr.siret||"",adresse:pr.adresse||""}}))}
async function sealHash(f,sig){return sha256(docCanon(f,sig.emetteur)+"|"+sig.nom+"|"+sig.date+"|"+(await sha256(sig.img)))}
const codeOf=h=>h.slice(0,16).toUpperCase().match(/.{4}/g).join("-");
async function verifyDoc(f){if(!f||!f.signature)return {ok:false,msg:"Ce document n'est pas signé."};
  const h=await sealHash(f,f.signature);
  return h===f.signature.hash?{ok:true,msg:`Authentique : contenu identique à celui signé par ${f.signature.nom} le ${new Date(f.signature.date).toLocaleString("fr-FR")}.`}:{ok:false,msg:"Attention : le document a été modifié après sa signature. L'empreinte ne correspond plus."}}
function signModal(f,id,onDone){
  const pr=profil();
  openModal(`<header><div><span class="eyebrow">${esc(f.numero||"")}</span><h2>Signer le document</h2></div><button class="btn ghost" data-close aria-label="Fermer">✕</button></header>
  <p class="muted">Signez avec le doigt ou la souris. Une empreinte numérique (SHA-256) du contenu est calculée et imprimée sur le PDF : toute modification ultérieure sera détectée.</p>
  <div class="sigpad"><canvas id="sig-canvas" width="900" height="300" aria-label="Zone de signature"></canvas><span class="sig-hint">Signez ici</span></div>
  <div class="row"><button class="btn small ghost" type="button" data-sig-clear>Effacer</button></div>
  <form class="form" id="sig-form"><label>Nom du signataire<input id="sig-nom" required value="${esc(pr.nom||"")}"></label><label>Qualité<input id="sig-qual" value="${esc(pr.fonction||"")}" placeholder="ex. Gérant"></label>
   <label class="full" style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" id="sig-ok" required style="width:22px;height:22px;flex:none"> Je certifie l'exactitude de ce document et le signe électroniquement.</label>
   <div class="full row"><button class="btn primary" type="submit">Signer et sceller</button></div></form>`);
  const c=document.getElementById("sig-canvas");const ctx=c.getContext("2d");let drawing=false,last=null,has=false;
  ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#17363F";
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);has=true;c.parentElement.classList.add("used")});
  c.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.quadraticCurveTo(last[0],last[1],(last[0]+p[0])/2,(last[1]+p[1])/2);ctx.lineTo(...p);ctx.stroke();last=p});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev,()=>{drawing=false}));
  document.querySelector("[data-sig-clear]").onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false;c.parentElement.classList.remove("used")};
  $("#sig-form").onsubmit=async e=>{e.preventDefault();if(!has){toast("Tracez votre signature");return}
    const sig={img:c.toDataURL("image/png"),nom:val("sig-nom"),qualite:val("sig-qual"),date:new Date().toISOString(),emetteur:{nom:pr.nom||"",raison:pr.raison||"",siret:pr.siret||"",adresse:pr.adresse||""}};
    sig.hash=await sealHash(f,sig);sig.code=codeOf(sig.hash);
    const d={...clean(f),signature:sig,statut:f.statut==="brouillon"?"envoye":f.statut};
    await put("factures",id,d);closeModal();toast("Document signé · code "+sig.code);onDone&&onDone({...d,id});
  };
}
function verifyModal(){
  openModal(`<header><h2>Vérifier un document signé</h2><button class="btn ghost" data-close aria-label="Fermer">✕</button></header>
  <p class="muted">Saisissez le numéro et le code de vérification imprimés en bas du PDF.</p>
  <form class="form" id="vf-form"><label>Numéro<input id="vf-num" placeholder="D-2026-001"></label><label>Code de vérification<input id="vf-code" placeholder="XXXX-XXXX-XXXX-XXXX"></label>
  <div class="full row"><button class="btn primary" type="submit">Vérifier</button></div></form><div id="vf-res"></div>`);
  $("#vf-form").onsubmit=async e=>{e.preventDefault();const f=S.data.factures.find(x=>x.numero===val("vf-num").toUpperCase());const out=document.getElementById("vf-res");
    if(!f){out.innerHTML=`<div class="verif bad">Aucun document portant ce numéro.</div>`;return}
    const code=val("vf-code").toUpperCase().replace(/[^0-9A-F]/g,"");
    if(!f.signature||f.signature.code.replace(/-/g,"")!==code){out.innerHTML=`<div class="verif bad">Le code ne correspond pas à ce document.</div>`;return}
    const r=await verifyDoc(f);out.innerHTML=`<div class="verif ${r.ok?"good":"bad"}">${esc(r.msg)}</div>`};
}

async function facturePDF(f){
  if(!window.jspdf){toast("Module PDF indisponible (connexion ?)");return null}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const pr=f.signature?.emetteur?{...profil(),...f.signature.emetteur}:profil();
  const C=BRAND;const T=s=>String(s??"").replace(/[  ]/g," ").replace(/[’]/g,"'").replace(/≈/g,"env.");
  const M=(n)=>T(money(n,f.devise));const t=totals(f);const W=210,L=15,R=195;
  const fill=c=>doc.setFillColor(...c),txt=c=>doc.setTextColor(...c),draw=c=>doc.setDrawColor(...c);
  const header=()=>{
    try{doc.addImage(pr.logo||LOGO_GM,"PNG",L,12,58,58*247/900)}catch(e){}
    doc.setFont("helvetica","bold");doc.setFontSize(22);txt(C.teal);doc.text(f.type==="devis"?"DEVIS":"FACTURE",R,19,{align:"right"});
    doc.setFontSize(10);txt(C.ink);doc.text(T(f.numero||""),R,25,{align:"right"});
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);txt(C.gray);
    doc.text(T("Date : "+new Date(f.date).toLocaleDateString("fr-FR")),R,30,{align:"right"});
    doc.text(T(f.type==="facture"&&f.echeance?"Échéance : "+new Date(f.echeance).toLocaleDateString("fr-FR"):f.type==="devis"?"Valable "+(f.validite||30)+" jours":""),R,34,{align:"right"});
    draw(C.orange);doc.setLineWidth(1.2);doc.line(L,40,L+22,40);draw(C.light);doc.setLineWidth(0.3);doc.line(L+22,40,R,40);
  };
  const footer=(i,n)=>{draw(C.light);doc.setLineWidth(0.3);doc.line(L,280,R,280);doc.setFontSize(6.8);txt(C.gray);doc.setFont("helvetica","normal");
    const id=[pr.raison||pr.nom,pr.siret?("SIRET/IFU "+pr.siret):"",pr.email,pr.tel].filter(Boolean).join("  ·  ");doc.text(T(id),L,284);
    if(f.signature){doc.setFont("courier","normal");doc.setFontSize(6.2);doc.text("Empreinte SHA-256 : "+f.signature.hash,L,288);doc.setFont("helvetica","bold");doc.setFontSize(7);txt(C.teal);doc.text("Code de vérification : "+f.signature.code,L,292)}
    doc.setFont("helvetica","normal");txt(C.gray);doc.setFontSize(7);doc.text(`Page ${i} / ${n}`,R,292,{align:"right"})};
  header();
  let y=48;doc.setFontSize(7.5);doc.setFont("helvetica","bold");txt(C.gray);doc.text("ÉMETTEUR",L,y);doc.text("CLIENT",112,y);
  y+=5;doc.setFontSize(10);txt(C.ink);doc.text(T(pr.nom||""),L,y);doc.setFont("helvetica","normal");doc.setFontSize(8.5);txt([70,85,90]);
  const emet=[pr.raison,...String(pr.adresse||"").split("\n"),pr.email,pr.tel,pr.siret?("SIRET / IFU : "+pr.siret):""].filter(Boolean).map(T);
  emet.forEach((l,i)=>doc.text(l,L,y+5+i*4.2));
  doc.setFont("helvetica","bold");doc.setFontSize(10);const cn=doc.splitTextToSize(T(f.client||"—"),R-118);const ca=String(f.clientAdresse||"").split("\n").filter(Boolean);
  fill(C.soft);doc.roundedRect(110,y-4.5,R-110,Math.max(22,7+cn.length*4.6+ca.length*4.2),2,2,"F");
  txt(C.ink);doc.text(cn,114,y+1);doc.setFont("helvetica","normal");doc.setFontSize(8.5);txt([70,85,90]);
  ca.forEach((l,i)=>doc.text(T(l),114,y+1+cn.length*4.6+i*4.2));
  y=Math.max(y+8+emet.length*4.2,y+26);
  if(f.objet){doc.setFontSize(9.5);doc.setFont("helvetica","bold");txt(C.ink);doc.text("Objet : ",L,y);doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(T(f.objet),R-L-15),L+14,y);y+=8}
  const cols=[[L+2,"Désignation","left"],[128,"Qté","right"],[131,"Unité","left"],[164,"Prix unitaire","right"],[R-2,"Total HT","right"]];
  const thead=()=>{fill(C.teal);doc.rect(L,y,R-L,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(8);txt([255,255,255]);cols.forEach(([x,l,a])=>doc.text(T(l),x,y+5.3,{align:a}));y+=8};
  thead();doc.setFont("helvetica","normal");doc.setFontSize(8.8);
  (f.lignes||[]).forEach((l,i)=>{const lines=doc.splitTextToSize(T(l.libelle),96);const h=Math.max(7,lines.length*4.2+3);
    if(y+h>235){doc.addPage();header();y=48;thead();doc.setFont("helvetica","normal");doc.setFontSize(8.8)}
    if(i%2){fill(C.soft);doc.rect(L,y,R-L,h,"F")}txt(C.ink);doc.text(lines,L+2,y+4.8);
    doc.text(T(String(l.qte).replace(".",",")),128,y+4.8,{align:"right"});doc.text(T(l.unite||""),131,y+4.8);doc.text(M(l.pu),164,y+4.8,{align:"right"});doc.text(M((l.qte||0)*(l.pu||0)),R-2,y+4.8,{align:"right"});y+=h});
  draw(C.light);doc.setLineWidth(0.3);doc.line(L,y,R,y);y+=6;
  if(y>225){doc.addPage();header();y=50}
  const tx=128;doc.setFontSize(9);txt([70,85,90]);doc.text("Total HT",tx,y);doc.text(M(t.ht),R-2,y,{align:"right"});y+=5.5;
  doc.text(T("TVA "+String(f.tva).replace(".",",")+" %"),tx,y);doc.text(M(t.tva),R-2,y,{align:"right"});y+=3;

  if(f.devise==="XOF"){doc.setFont("helvetica","normal");doc.setFontSize(7.5);txt(C.gray);doc.text(T("soit environ "+money(t.ttc/XOF,"EUR")),R-2,y+14,{align:"right"})}
  y+=20;doc.setFont("helvetica","normal");doc.setFontSize(8);txt([70,85,90]);
  const cond=[f.mentions,f.type==="facture"?`Paiement au plus tard le ${f.echeance?new Date(f.echeance).toLocaleDateString("fr-FR"):"—"}. En cas de retard : pénalités au taux légal et indemnité forfaitaire de 40 € pour frais de recouvrement (clients professionnels en France).${pr.iban?" IBAN : "+pr.iban:""}`:"Devis valable "+(f.validite||30)+" jours à compter de sa date d'émission."].filter(Boolean).map(T).join("\n");
  const cl=doc.splitTextToSize(cond,R-L);if(y+cl.length*3.8+45>278){doc.addPage();header();y=50}doc.text(cl,L,y);y+=cl.length*3.8+6;
  const sy=y;doc.setFont("helvetica","bold");doc.setFontSize(7.5);txt(C.gray);doc.text("SIGNATURE DE L'ÉMETTEUR",L,sy);doc.text(f.type==="devis"?"BON POUR ACCORD DU CLIENT":"",112,sy);
  draw(C.light);doc.setLineWidth(0.3);doc.roundedRect(L,sy+2,85,34,2,2,"S");if(f.type==="devis")doc.roundedRect(110,sy+2,R-110,34,2,2,"S");
  if(f.signature){try{doc.addImage(f.signature.img,"PNG",L+4,sy+4,60,20)}catch(e){}doc.setFont("helvetica","normal");doc.setFontSize(7.5);txt(C.ink);
    doc.text(T(`${f.signature.nom}${f.signature.qualite?", "+f.signature.qualite:""}`),L+4,sy+28);txt(C.gray);doc.text(T("Signé électroniquement le "+new Date(f.signature.date).toLocaleString("fr-FR")),L+4,sy+32)}
  else{doc.setFont("helvetica","italic");doc.setFontSize(8);txt(C.gray);doc.text("Non signé",L+4,sy+20)}
  if(f.type==="devis"){doc.setFont("helvetica","italic");doc.setFontSize(7.5);txt(C.gray);doc.text(T("Date, nom, signature et mention « Bon pour accord »"),114,sy+32)}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);footer(i,n)}
  doc.setProperties({title:`${f.type==="devis"?"Devis":"Facture"} ${f.numero}`,subject:f.objet||"",author:pr.nom||"",creator:"GéoPrompt Studio",keywords:f.signature?("sha256:"+f.signature.hash):""});
  return doc.output("blob");
}

  if(names&&!emailOK(v.email))return "Adresse email invalide.";
  if(v.pass.length<8||!/\d/.test(v.pass))return "Le mot de passe doit faire au moins 8 caractères et contenir un chiffre.";
  if(v.pass!==v.pass2)return "Les deux mots de passe ne correspondent pas.";
  return "";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-auth-tab],[data-pw-toggle],[data-lock]");if(!t)return;
  if(t.dataset.authTab){e.preventDefault();setAuthMode(t.dataset.authTab);return}
  if(t.dataset.pwToggle!==undefined){const i=document.getElementById("au-pass"),i2=document.getElementById("au-pass2");const show=i.type==="password";i.type=show?"text":"password";if(i2)i2.type=i.type;t.textContent=show?"Masquer":"Afficher";return}
  if(t.dataset.lock!==undefined){closeModal();lockApp();return}
});

/* ---- Version Claude : compte local protégé par mot de passe (PBKDF2) ---- */
async function pbkdf2(pass,saltHex,iter){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function compte(){return (S.data.reglages||[]).find(r=>r.id==="compte")}
function gateOK(){const c=compte();if(!c)return false;if(S.unlockedHash===c.hash)return true;try{return sessionStorage.getItem("gm-unlock")===c.hash.slice(0,24)}catch(e){return false}}
function localGate(){
  if(IS_STANDALONE)return;
  let g=document.getElementById("gm-gate");
  if(S.unlocked||(S.loaded&&gateOK())){S.unlocked=true;if(g)g.remove();return}
  if(!g){
    document.body.insertAdjacentHTML("beforeend",`<div class="login gate" id="gm-gate">${authMarkup()}</div>`);
    document.getElementById("auth-form").addEventListener("submit",localAuthSubmit);setAuthMode("signin");authMsg("Chargement…");
  }
  if(S.loaded&&!S.gateModeSet){S.gateModeSet=true;const c=compte();setAuthMode(c?"signin":"signup");if(c)document.getElementById("au-email").value=c.email||""}
}
async function localAuthSubmit(e){
  e.preventDefault();if(!S.loaded){authMsg("Chargement de vos données, un instant…");return}
  const v=authValues(),m=S.authMode,c=compte();
  if(m==="signup"){
    if(c){setAuthMode("signin");authMsg("Un compte existe déjà sur cet espace : connectez-vous.",true);return}
    const err=checkNew(v,true);if(err){authMsg(err,true);return}
    authMsg("Création du compte…");
    const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""),iter=210000;
    const hash=await pbkdf2(v.pass,salt,iter);
    await put("reglages","compte",{prenom:v.prenom,nom:v.nom,email:v.email,salt,iter,hash,creeLe:new Date().toISOString()});
    const p=profil();await put("reglages","profil",{...clean(p),nom:p.nom||`${v.prenom} ${v.nom}`,email:p.email||v.email,onboarded:true});
    unlock(hash);toast(`Bienvenue ${v.prenom} !`);return;
  }
  if(m==="signin"){
    if(!c){setAuthMode("signup");return}
    if(!v.email||!v.pass){authMsg("Saisissez votre email et votre mot de passe.",true);return}
    authMsg("Vérification…");
    const h=await pbkdf2(v.pass,c.salt,c.iter||210000);
    if(v.email!==String(c.email||"").toLowerCase()||h!==c.hash){authMsg("Email ou mot de passe incorrect.",true);return}
    unlock(c.hash);toast(`Bonjour ${c.prenom||""} !`);return;
  }
  if(m==="reset-req")authMsg("Sur cette version, la réinitialisation se fait depuis la conversation Claude : demandez « réinitialise mon mot de passe GéoPrompt ». Vos données sont conservées.");
}
function unlock(hash){S.unlocked=true;S.unlockedHash=hash;try{sessionStorage.setItem("gm-unlock",hash.slice(0,24))}catch(e){}
  const g=document.getElementById("gm-gate");if(g){g.classList.add("out");setTimeout(()=>g.remove(),400)}render()}
function lockApp(){
  if(IS_STANDALONE){if(typeof logout==="function")logout();return}
  try{sessionStorage.removeItem("gm-unlock")}catch(e){}S.unlocked=false;S.unlockedHash=null;S.gateModeSet=false;localGate();
}

showSplash();
boot();

  const R=window.SpeechRecognition||window.webkitSpeechRecognition;const b=document.getElementById("mic-btn");if(!R||!b)return;b.hidden=false;

    r.onend=()=>b.classList.remove("primary");r.onerror=()=>{b.classList.remove("primary");toast("Dictée indisponible : utilisez le micro du clavier")};r.start()}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
